#
# i3blocks block that shows the one-line cirrocast status probe. Put this block
# in ~/.config/i3blocks/config; i3blocks runs `command` every `interval` seconds
# and renders its first line as the block label.
#
# cirrocast-example: cirrocast status -q --format '%c %t'
[weather]
command=cirrocast status -q --format '%c %t'
interval=900
