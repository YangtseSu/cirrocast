#
# polybar `custom/script` module that shows the one-line cirrocast status probe.
# Add `modules-right = weather` to your `[bar/...]` section and put this module
# in ~/.config/polybar/config.ini; polybar re-runs the command every `interval`.
#
# cirrocast-example: cirrocast status -q --format '%c %t'
[module/weather]
type = custom/script
exec = cirrocast status -q --format '%c %t'
interval = 900
