#
# tmux status line snippet that shows the one-line cirrocast status probe. Put
# these lines in ~/.tmux.conf; tmux runs the `#(...)` job through `/bin/sh -c`
# every `status-interval` seconds, so the double quotes around `status-right`
# are stripped by tmux and the inner single quotes reach cirrocast as-is.
#
# cirrocast-example: cirrocast status -q --format '%c%t'
set -g status-interval 900
set -g status-right "#(cirrocast status -q --format '%c%t')"
