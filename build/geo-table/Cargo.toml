# Dev-only builder for the embedded GeoNames city table (`src/geo/data/*.bin.gz`, step 18).
# `publish = false`: it is not part of the crate the release publishes, and `cargo package` on the
# root manifest never picks it up.
[package]
name = "geo-table"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Builds cirrocast's embedded city table from a GeoNames cities15000.txt"
license = "GPL-3.0-or-later"

[dependencies]
# The root crate supplies the whole format (`geo::table`: the dump parser, the encoders, the gzip
# writer and the SNAPSHOT record), so this binary is only the command line and the file writing.
# `default-features = false` keeps this build free of the `offline-geo` feature, so a fresh
# checkout can run the builder before the blobs exist.
cirrocast = { path = "../..", default-features = false }

[lints]
workspace = true
