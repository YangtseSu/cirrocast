# Dev-only builder for the embedded GeoNames city table (`src/geo/data/*.bin.gz`, step 18).
# `publish = false`: it is not part of the crate the release publishes, and `cargo package` on the
# root manifest never picks it up.
[package]
name = "geo-table"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Builds cirrocast's embedded city table from a GeoNames cities15000.txt"
license = "GPL-3.0-or-later"

[dependencies]
# The root crate supplies the whole build path: `geo::update::build_candidate` reads or fetches the
# dump (shared HTTP client, so the guard and the proxy apply), extracts the ZIP, parses and encodes
# with `geo::table`, and validates the result with the decoder — the same code
# `cirrocast location update-data` runs. This binary is only the command line and the file writing.
# `default-features = false, features = ["offline-geo"]` asks for exactly the decoder that
# validation needs, without implying anything else.
cirrocast = { path = "../..", default-features = false, features = ["offline-geo"] }

[lints]
workspace = true
