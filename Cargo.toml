[package]
name = "cirrocast"
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal weather client with pluggable backends and wttr.in-style output"
license = "GPL-3.0-or-later"
repository = "https://github.com/YangtseSu/cirrocast"
readme = "README.md"
keywords = ["weather", "cli", "forecast", "terminal", "wttr"]
categories = ["command-line-utilities"]
# The published crate is exactly this: the sources, the embedded catalogs and the files a consumer
# of the crate has to be able to read. Tests, fixtures, docs, CI and packaging stay out. The
# lockfile is listed because every release path builds with `--locked`.
include = [
    "src/**",
    "locales/**",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/Cargo.lock",
]

# docs.rs renders the library target (the modules the integration tests compile against) with every
# feature enabled.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["offline-geo"]
# The embedded GeoNames city table behind `src/geo/offline.rs` (`src/geo/data/*.bin.gz`): a build
# with `--no-default-features` drops the table and the offline geocoder with it, and the location
# path falls back to the network geocoder (step 18 documents the switch and its cost).
offline-geo = []

[dependencies]
# JWT minting for QWeather's second authentication mode (step 27): `ring` signs the token and
# `base64` writes the two unpadded URL-safe segments. Both crates are already compiled into this
# binary (`rustls` → `ring`, `ureq` → `base64`), so declaring them adds no crate to the graph;
# `ring` is used for its `Ed25519KeyPair` PKCS#8 parser and nothing else.
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
etcetera = "0.11"
# gzip for the embedded city table (step 18) and for `gzip`-encoded HTTP bodies (`src/http.rs`
# decodes after the capped read, so the wire cap cannot be bypassed by an expansion bomb). The
# offline decoder uses the pure-Rust miniz_oxide backend without a C toolchain. `ureq` runs without
# its own transparent gzip decoder (see the `ureq` line below), so this is the crate's only inflate
# dependency.
flate2 = "1"
fluent-bundle = "0.16"
percent-encoding = "2.3.2"
quick-xml = "0.42"
ring = "0.17.14"
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2"
toml = "1.1.6"
# Coordinate → IANA time zone, for backends whose payload carries no zone (METAR). Offline: the
# `bundled` feature embeds the polygon index, so no data file is read at runtime. Any 2.x is
# accepted and `Cargo.lock` records the resolved release; `default-features = false` drops the
# crate's own command line front end, which this project does not use.
tzf-rs = { version = "2", default-features = false, features = ["bundled"] }
unic-langid = { version = "0.9", features = ["macros"] }
# NFKD name folding for the offline city index (step 18): the builder folds the index keys and the
# runtime folds the query, and both sides must agree byte for byte. MIT OR Apache-2.0, no unsafe.
unicode-normalization = "0.1.24"
unicode-width = "0.2.2"
# Default features are off on purpose: `gzip` (and `brotli`) install a transparent decoder that
# sits *inside* `MAX_BODY_BYTES`'s `LimitReader`, so a small compressed response could inflate
# without bound. Without them the cap bounds the bytes read off the socket, and `http.rs` refuses
# any response that still declares a non-identity `Content-Encoding`.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
# The JWT tests decode the two token segments, so the integration tests need the same engine the
# minting code uses (a normal dependency is not visible to them).
base64 = "0.23.1"
insta = "1.48.0"
predicates = "3"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

[workspace]
# The dev-only table builder (step 18). It is not part of the published crate, and because the
# root manifest is a package, `cargo build`/`test`/`clippy` from the repository root still act on
# the root package alone — the builder is reached explicitly, `cargo run -p geo-table`.
members = ["build/geo-table"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# The dev/test profile keeps line tables and drops the rest of DWARF. At the cargo default
# (`debug = 2`) one integration test binary of this workspace is 85.8 MiB, and `cargo test` leaves a
# new generation of every test target behind on each run, so `target/debug` grew by ~5.7 GiB per
# iteration. Line tables alone still resolve panic backtraces to `file:line` and gdb line
# breakpoints, at 24.4 MiB per binary. Variable inspection needs full DWARF:
# `cargo test --config 'profile.dev.debug=2'`. Measurements: docs/performance.md.
[profile.dev]
debug = "line-tables-only"

# The shipped profile: the smallest, fastest binary the toolchain can produce without a C
# toolchain or nightly flags. `lto = "thin"` plus `codegen-units = 1` gives the whole-program
# optimiser one unit to work with; `strip = "symbols"` drops the symbol table the release
# archives never needed; `panic = "abort"` is sound here because every user-triggered failure is a
# typed `Error` and no release path unwinds (step 21 records the measurement and the reasoning in
# docs/performance.md).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The audit profile behind `cargo bloat`/`cargo llvm-lines` (step 21): identical code to
# `release`, but with the symbol table kept so the tools can attribute bytes to crates and
# monomorphisations. Never shipped, never used by the bench harness (which measures the real
# release profile).
[profile.release-audit]
inherits = "release"
strip = "none"
