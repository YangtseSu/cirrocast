[package]
name = "cirrocast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal weather client with pluggable backends and wttr.in-style output"
license = "GPL-3.0-or-later"
repository = "https://github.com/YangtseSu/cirrocast"
readme = "README.md"
keywords = ["weather", "cli", "forecast", "terminal", "wttr"]
categories = ["command-line-utilities"]
exclude = ["docs/", ".github/"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
etcetera = "0.11"
percent-encoding = "2.3.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
