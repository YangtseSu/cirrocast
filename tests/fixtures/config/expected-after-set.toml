# The canonical document `cirrocast config set defaults.days 5` produces from the built-in
# defaults: `set` serialises the whole typed configuration, so the file always has this shape.

schema_version = 2

[defaults]
provider = "open-meteo"
format = "art-table"
units = "metric"
days = 5
language = "auto"

[location]
default = ""
pick = "auto"

[geo]
strategy = "auto"
data = "auto"
update = "off"
update_interval_days = 90
update_url = ""

[units]

[network]
timeout_secs = 15
retries = 3
proxy = ""
nominatim_url = ""
offline = "off"

[cache]
enabled = true
weather_ttl_secs = 600
ip_ttl_secs = 86400
geocode_ttl_secs = 2592000

[render]
color = "auto"
width = 0

[alerts]
enabled = true
severity_threshold = "minor"
sources = ["auto"]
fpas_url = ""
cache_ttl_secs = 300

[air]
index = "us"

[providers.metar]
station = ""

[providers.qweather]
host = ""

[locations]

[templates]
