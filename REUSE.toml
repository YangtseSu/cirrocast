version = 1

SPDX-PackageName = "cirrocast"
SPDX-PackageSupplier = "Yangtse Su <yangtsesu@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/YangtseSu/cirrocast"

# Generated lockfile: cargo owns the content, so licensing info cannot live in a header.
[[annotations]]
path = "Cargo.lock"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# First-party fixtures: JSON and CSV cannot carry a comment header, but the content is ours
# (hand-written cases, minimised envelopes, responses reduced to the fields the code reads).
#
# This list is deliberately explicit per directory: third-party data fixtures are annotated
# separately below so that no recorded upstream payload is ever relicensed to GPL by a blanket rule.
#
# The `visualcrossing/` timeline fixture is hand-authored from the published schema, not recorded:
# no API key for that service exists in this repository, so its payload is a documented-shape
# stand-in (the same caveat is repeated in `tests/provider_visualcrossing.rs`).

[[annotations]]
path = [
    "tests/fixtures/config/**",
    "tests/fixtures/malformed/**",
    "tests/fixtures/model/**",
    "tests/fixtures/http/**",
    "tests/fixtures/report/**",
    "tests/fixtures/smhi/point_sentinel_2026-10-01.json",
    "tests/fixtures/visualcrossing/**",
    "tests/fixtures/air/truncated.json",
    "tests/fixtures/air/no-current.json",
    "tests/fixtures/air/unit-mismatch.json",
    "tests/fixtures/marine/no-current.json",
    "tests/fixtures/geo/cities-sample.txt",
    "tests/fixtures/geo/cities-sample.zip",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Recorded Open-Meteo Air Quality responses (CAMS ENSEMBLE model data, CC BY 4.0): kept verbatim
# and annotated with the upstream licence; the panel prints the matching credit. The hand-written
# edge cases stay in the first-party block above, so this list names only the three recordings.
[[annotations]]
path = [
    "tests/fixtures/air/berlin-2026-10-03.json",
    "tests/fixtures/air/sydney-2026-10-03.json",
    "tests/fixtures/air/reykjavik-2026-10-03.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com (CAMS ENSEMBLE)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded Open-Meteo archive responses (CC BY 4.0): the sunrise/sunset/daylight rows the
# astronomy tests compare their local computation against, kept verbatim. The moon instants,
# book instants and moonrise references in the same directory are not payloads — they live in
# `README.md` and `tests/astro.rs`, which carry the project licence.
[[annotations]]
path = "tests/fixtures/astro/open-meteo-*.json"
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded IP-geolocation payloads (ipwho.is primary, ipapi.co fallback). Their terms forbid
# redistribution — ipwho.is is "personal or internal use, no redistribution" and ipapi.co is
# "internal use, no resale" (README's data-sources table) — so they cannot be relicensed GPL and
# carry the same custom licence reference as the other recorded proprietary payloads.
[[annotations]]
path = "tests/fixtures/ip/**"
precedence = "override"
SPDX-FileCopyrightText = "ipwho.is and ipapi.co (recorded API responses)"
SPDX-License-Identifier = "LicenseRef-Proprietary-API-Data"

# The Open-Meteo 400 envelope is a verbatim recording of the forecast API's error body, so it
# keeps the upstream CC BY 4.0 licence instead of the first-party GPL rule for the rest of
# `tests/fixtures/http/**`. This annotation is later than that block, so it wins for this path.
[[annotations]]
path = "tests/fixtures/http/open_meteo_error_invalid_param.json"
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com"
SPDX-License-Identifier = "CC-BY-4.0"

# insta snapshots. The `.snap` format is insta's (a YAML header, then the recorded text), so the
# files cannot carry a comment header of their own; the content is our own renderer output.
[[annotations]]
path = "tests/snapshots/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The performance baseline (step 21): a JSON document the harness writes and the CI `perf` job
# reads, so it cannot carry a comment header of its own.
[[annotations]]
path = "perf/baseline.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Recorded Open-Meteo geocoding responses. The place data behind the service comes from GeoNames,
# which is published under CC BY 4.0; the fixtures are trimmed to the hits the tests exercise.
[[annotations]]
path = [
    "tests/fixtures/geo/open_meteo_geocode_beijing.json",
    "tests/fixtures/geo/open_meteo_geocode_beijing_ambiguous.json",
    "tests/fixtures/geo/open_meteo_geocode_no_hits.json",
    "tests/fixtures/geo/open_meteo_geocode_bad_timezone.json",
    "tests/fixtures/geo/open_meteo_geocode_xinxiang_zh.json",
    "tests/fixtures/geo/open_meteo_geocode_vienna.json",
]
precedence = "override"
SPDX-FileCopyrightText = "GeoNames (geocoding data served by Open-Meteo)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded Open-Meteo forecast responses (weather model data, CC BY 4.0). They are kept verbatim
# and carry the upstream licence rather than being relicensed; the provider prints the matching
# credit line.
#
# Provenance: the four dates are in the past, so `historical-forecast-api.open-meteo.com/v1/forecast`
# served them — the same parameter names, response schema and variables as the forecast endpoint the
# provider calls — fetched directly over TLS with the provider's own parameter list, byte for byte.
# The `current` block of each file is the observation at recording time (2026-09-30, 11:30Z) and is
# what carries the `uv_index` value the `%u` token and the JSON schema read.
[[annotations]]
path = "tests/fixtures/open_meteo/**"
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded Open-Meteo Marine Weather responses (wave and sea-surface model data, CC BY 4.0; the
# marine product blends Copernicus Marine Service and DWD ICON Wave data). `sylt.json` is the
# verbatim recording for Sylt, 54.54/10.23; `berlin-land.json` is the same payload trimmed to the
# fields the marine decoder reads, for the land-point far-cell case. The synthetic `no-current.json`
# stays first-party (listed above) because it is hand-authored to exercise the refusal path.
[[annotations]]
path = [
    "tests/fixtures/marine/sylt.json",
    "tests/fixtures/marine/berlin-land.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com (Copernicus Marine Service, DWD ICON Wave)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded Open-Meteo archive (historical weather API) responses: the reanalysis is ERA5/
# ERA5-Land/IFS, distributed by Open-Meteo under CC BY 4.0, so the fixture keeps the upstream
# licence and the provider prints the matching credit line. The body is verbatim, requested with the
# provider's own parameter list over the archive endpoint.
[[annotations]]
path = "tests/fixtures/archive/**"
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com (ERA5/Copernicus reanalysis)"
SPDX-License-Identifier = "CC-BY-4.0"

# The cache fixture step 22's `status` probe and `contrib/statusbar/verify.sh` read offline: a real
# cache envelope (`CacheEntry`) around the recorded Beijing forecast body above, so it carries that
# payload's upstream licence rather than the GPL rule for first-party fixtures. The `fetched_at`
# stamp is deliberately old and the TTL the provider really writes, which is what makes the
# fixture exercise the stale answer `--offline` promises to serve.
[[annotations]]
path = "tests/fixtures/cache/weather/**"
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com"
SPDX-License-Identifier = "CC-BY-4.0"

# JSON Schema documents (step 22's `docs/schema/json-v2.json`, step 28's frozen v1 beside it): JSON
# cannot carry a comment header, and the schemas are our own description of our own output.
[[annotations]]
path = "docs/schema/*.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Recorded proprietary API payloads (WeatherAPI.com, World Weather Online, Pirate Weather,
# QWeather): the data stays the provider's property, so the fixtures carry a custom licence
# reference rather than GPL or an open-data identifier. See the notice file for the terms links.
[[annotations]]
path = [
    "tests/fixtures/weatherapi/**",
    "tests/fixtures/wwo/**",
    "tests/fixtures/pirateweather/**",
    "tests/fixtures/qweather/**",
]
precedence = "override"
SPDX-FileCopyrightText = "WeatherAPI.com, World Weather Online, Pirate Weather and QWeather (recorded API responses)"
SPDX-License-Identifier = "LicenseRef-Proprietary-API-Data"

# Recorded OpenWeatherMap responses: the data is ODbL 1.0 (attribution required, share-alike only
# for an adapted database), and the fixtures keep the upstream licence rather than being relicensed.
# The API key travels in the request's `appid` query parameter and is absent from every response
# body, so these recorded bodies carry no key at all.
[[annotations]]
path = "tests/fixtures/owm/**"
precedence = "override"
SPDX-FileCopyrightText = "OpenWeather Ltd."
SPDX-License-Identifier = "ODbL-1.0"

# Recorded SMHI SNOW1gv1 responses: SMHI's open data is CC BY 4.0 SE (SPDX has no port identifier,
# and the port is CC BY 4.0 adapted to Swedish law), so the fixtures keep the upstream licence and
# the provider prints `SMHI (CC BY 4.0 SE)`. `point_sentinel_2026-10-01.json` is hand-written from
# the same schema to exercise the in-band `9999` missing marker, so it stays first-party (listed
# with the other hand-written fixtures above).
[[annotations]]
path = [
    "tests/fixtures/smhi/point_stockholm_2026-09-30.json",
    "tests/fixtures/smhi/point_out_of_coverage_404.html",
]
precedence = "override"
SPDX-FileCopyrightText = "SMHI (Swedish Meteorological and Hydrological Institute)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded MET Norway `Locationforecast/2.0 compact` responses: MET's open data is CC BY 4.0, so
# the recordings keep the upstream licence and the provider prints `Data from MET Norway (CC BY
# 4.0)`. `polar-twilight.json` is hand-trimmed from the `oslo.json` recording (its `_provenance`
# field says so) but remains MET data, so the whole directory carries the one licence.
[[annotations]]
path = "tests/fixtures/met-no/**"
precedence = "override"
SPDX-FileCopyrightText = "MET Norway (Norwegian Meteorological Institute)"
SPDX-License-Identifier = "CC-BY-4.0"

# The embedded GeoNames city table (step 18): the vendored `cities15000` snapshot
# (`src/geo/data/cities.bin.gz`, `keys.bin.gz`) and the provenance record beside it. GeoNames
# publishes the data under CC BY 4.0, so the members keep that licence and are *not* relicensed to
# GPL; the `geo-table` builder that produces them is first-party and carries the GPL header. The
# runtime prints the matching credit (`Location data by GeoNames (CC BY 4.0)`).
[[annotations]]
path = [
    "src/geo/data/cities.bin.gz",
    "src/geo/data/keys.bin.gz",
    "src/geo/data/SNAPSHOT",
]
precedence = "override"
SPDX-FileCopyrightText = "GeoNames (https://www.geonames.org/)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded OpenStreetMap/Nominatim responses: ODbL requires attribution, and the fixtures keep the
# upstream licence rather than being relicensed.
[[annotations]]
path = [
    "tests/fixtures/geo/nominatim_search_tsinghua.json",
    "tests/fixtures/geo/nominatim_search_tsinghua_ambiguous.json",
]
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"

# Recorded aviation weather: METAR/SPECI observations (the raw report and the `format=json` body
# the provider decodes) and `stationinfo` metadata rows. NOAA/NWS is US government material and
# therefore public domain, which is why these directories are annotated per path with a
# `LicenseRef` instead of falling under the GPL override for first-party fixtures. The `ZZZZ`
# sentinel rows are hand-authored and carved out below.
[[annotations]]
path = [
    "tests/fixtures/metar/**",
    "tests/fixtures/stationinfo/**",
]
precedence = "override"
SPDX-FileCopyrightText = "NOAA/NWS (aviationweather.gov)"
SPDX-License-Identifier = "LicenseRef-US-Government-Public-Domain"

# Carve-out for the hand-authored `ZZZZ` sentinel inside the NOAA directories above: the unknown
# station used by the "unknown station" tests was written by hand from the schema, not recorded
# from aviationweather.gov, so it stays first-party. This annotation is later than the two NOAA
# globs, so it wins for these exact paths.
[[annotations]]
path = [
    "tests/fixtures/stationinfo/ZZZZ.json",
    "tests/fixtures/metar/ZZZZ/current.json",
    "tests/fixtures/metar/ZZZZ/truncated.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Alert fixtures (step 15): hand-written or hand-trimmed first-party data in the field shapes of
# the NWS, MeteoAlarm, QWeather, WMO SWIC, FPAS and HKO alert feeds. No live payload is stored
# verbatim: the redistribution terms of warning data are not uniform across the sources, so the
# fixtures were authored to the schemas instead of recorded. Provenance per file is in
# `tests/fixtures/alerts/README.md`.
[[annotations]]
path = "tests/fixtures/alerts/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"
# Recorded NWS forecast API payloads (api.weather.gov, the `points` lookup, the hourly series, the
# daily periods and the out-of-coverage 404 body). NOAA/NWS is US government material and therefore
# public domain, so these carry the same `LicenseRef` as the aviationweather.gov recordings.
# `edge_hourly.json` is hand-authored to the same schema for the Fahrenheit conversion, wind-range
# and null-value traps, so it is carved out below as first-party.
[[annotations]]
path = "tests/fixtures/nws/**"
precedence = "override"
SPDX-FileCopyrightText = "NOAA/NWS (api.weather.gov)"
SPDX-License-Identifier = "LicenseRef-US-Government-Public-Domain"

[[annotations]]
path = "tests/fixtures/nws/edge_hourly.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"
