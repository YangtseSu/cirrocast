version = 1

SPDX-PackageName = "cirrocast"
SPDX-PackageSupplier = "Yangtse Su <yangtsesu@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/YangtseSu/cirrocast"

# Generated lockfile: cargo owns the content, so licensing info cannot live in a header.
[[annotations]]
path = "Cargo.lock"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# First-party fixtures: JSON and CSV cannot carry a comment header, but the content is ours
# (hand-written cases, minimised envelopes, responses reduced to the fields the code reads).
#
# This list is deliberately explicit per directory: third-party data fixtures are annotated
# separately below so that no recorded upstream payload is ever relicensed to GPL by a blanket rule.
[[annotations]]
path = [
    "tests/fixtures/config/**",
    "tests/fixtures/model/**",
    "tests/fixtures/http/**",
    "tests/fixtures/ip/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Recorded Open-Meteo geocoding responses. The place data behind the service comes from GeoNames,
# which is published under CC BY 4.0; the fixtures are trimmed to the hits the tests exercise.
[[annotations]]
path = [
    "tests/fixtures/geo/open_meteo_geocode_beijing.json",
    "tests/fixtures/geo/open_meteo_geocode_beijing_ambiguous.json",
    "tests/fixtures/geo/open_meteo_geocode_no_hits.json",
    "tests/fixtures/geo/open_meteo_geocode_bad_timezone.json",
    "tests/fixtures/geo/open_meteo_geocode_xinxiang_zh.json",
]
precedence = "override"
SPDX-FileCopyrightText = "GeoNames (geocoding data served by Open-Meteo)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded Open-Meteo forecast responses (weather model data, CC BY 4.0). They are kept verbatim
# and carry the upstream licence rather than being relicensed; the provider prints the matching
# credit line.
#
# Provenance: the four dates are in the past, so `historical-forecast-api.open-meteo.com/v1/forecast`
# served them — the same parameter names, response schema and variables as the forecast endpoint the
# provider calls — fetched directly over TLS with the provider's own parameter list, byte for byte.
# The `current` block of each file is the observation at recording time (2026-09-30, 04:45Z), which
# the historical endpoint returns alongside the archived days.
[[annotations]]
path = "tests/fixtures/open_meteo/**"
precedence = "override"
SPDX-FileCopyrightText = "Open-Meteo.com"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded OpenStreetMap/Nominatim responses: ODbL requires attribution, and the fixtures keep the
# upstream licence rather than being relicensed.
[[annotations]]
path = [
    "tests/fixtures/geo/nominatim_search_tsinghua.json",
    "tests/fixtures/geo/nominatim_search_tsinghua_ambiguous.json",
]
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"
