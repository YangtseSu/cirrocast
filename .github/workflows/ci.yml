#
# The CI gate. Every check here is one a contributor can reproduce locally with the same command
# (see AGENTS.md → Commands); CI adds nothing a solo machine cannot run, it only makes the result
# binding.
#
# Conventions:
# * every third-party action is pinned to a commit SHA (the tag is kept as a comment);
# * the runner images are named explicitly (`ubuntu-26.04`, `macos-26`) rather than through
#   `<os>-latest`, whose meaning changes under the project's feet;
# * `CIRROCAST_FORBID_NETWORK=1` is exported for the whole test job, so an accidentally
#   network-dependent test fails loudly instead of quietly passing on a machine with a network;
# * there is no Windows job: v1 ships no Windows artefact and has no Windows-specific code path.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        rust: [stable, "1.98.0"]
    env:
      CIRROCAST_FORBID_NETWORK: "1"
      # Snapshot drift must fail the build, not hide in an untracked `.snap.new`: insta's `auto`
      # default writes nothing outside CI but still passes on a stale snapshot. Forcing `no` here
      # makes the committed snapshot the one that decides, as step 07's plan documents.
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  package:
    name: cargo package (dry-run publish)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What `cargo package` would upload is the crate's public surface, so the file set is
      # reviewed on every pull request and the packaged crate is compiled from that file set.
      # Nothing is uploaded here: the real publish is the release workflow's `publish` job.
      - name: the packaged file set
        run: cargo package --list --locked
      - name: publish dry run
        run: cargo publish --dry-run --locked

  gates:
    name: repository gates
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The render layer must not reach into the transport, the cache or the provider registry:
      # the renderers shape their output from what the report carries (step 12's render-path audit).
      #
      # The pattern is deliberately wider than an import: a grouped `use crate::{cache, provider}`
      # and a bare body path `crate::cache::Cache::new()` are both dependency edges, so both are
      # caught along with `crate::http`, `crate::provider`, `crate::cache` and the `super::` forms.
      # Comment lines (doc links such as `crate::provider::Capabilities` inside a doc comment) are
      # stripped first: a rustdoc link is documentation, not a code dependency, and would otherwise
      # fail the gate on a model doc comment.
      - name: no render/model dependency on http, provider or cache
        run: |
          hits=$(grep -rnE 'crate::(http|provider|cache)|crate::\{[^}]*(http|provider|cache)|super::(http|provider|cache)' src/render src/model \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*)' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::src/render and src/model must not reference http, provider or cache"
            exit 1
          fi
      # LICENSES/GPL-3.0-or-later.txt is a real copy (a Windows checkout cannot rely on symlinks),
      # so it must not drift from the root LICENSE GitHub detects.
      - name: LICENSE copy matches LICENSES/GPL-3.0-or-later.txt
        run: cmp -s LICENSE LICENSES/GPL-3.0-or-later.txt

  reuse:
    name: reuse lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # `--locked` makes cargo-deny judge the committed graph. Without it cargo metadata is
          # free to update `Cargo.lock` when the manifest disagrees, so a dependency set the build
          # would refuse could still pass the licence and advisory gate. `--all-features` is the
          # action's own default, kept because setting `arguments` replaces the default.
          arguments: --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `cargo audit` beside `cargo deny`: mirrored advisory databases can lag behind the live
      # RUSTSEC data, so the two checks are independent signals.
      #
      # The pin is the `main` commit "Update to use Node 24 (#48)" (2026-03-20), not a release: the
      # action's newest release, v2.0.0, still declares `node20`, which GitHub now runs on Node 24
      # with a deprecation warning. The commit changes only `runs.using` (plus the changelog and
      # package metadata), so it is safe to pin; replace it with the next release's tag when one
      # exists.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, Node 24 fix (unreleased)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
