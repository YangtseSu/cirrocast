# SPDX-License-Identifier: GPL-3.0-or-later
#
# The CI gate. Every check here is one a contributor can reproduce locally with the same command
# (see AGENTS.md → Commands); CI adds nothing a solo machine cannot run, it only makes the result
# binding.
#
# Conventions:
# * every third-party action is pinned to a commit SHA (the tag is kept as a comment);
# * the runner images are named explicitly (`ubuntu-26.04`, `macos-26`) rather than through
#   `<os>-latest`, whose meaning changes under the project's feet;
# * `CIRROCAST_FORBID_NETWORK=1` is exported for the whole test job, so an accidentally
#   network-dependent test fails loudly instead of quietly passing on a machine with a network;
# * there is no Windows job: v1 ships no Windows artefact and has no Windows-specific code path.

name: CI

# Every job here only reads the repository: no step writes a ref, an issue or a release artifact
# (the perf job uploads to the workflow's own run, which the token's default scope also allows from
# a read-only token). Declaring the scope at the top keeps a `pull_request` run of contributor test
# code — and the third-party actions it runs — off the repository's default token scope instead of
# inheriting it implicitly. `release.yml` sets the same block.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # The only way to re-record `perf/baseline.json`: an explicit dispatch. A normal run never
  # writes a baseline, it only compares against the committed one (see the `perf` job).
  workflow_dispatch:
    inputs:
      record_baseline:
        description: Re-record perf/baseline.json on this runner and upload it as an artifact
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--workspace` covers the dev-only `build/geo-table` builder beside the crate; the root
      # manifest is a package, so a bare `cargo clippy` in the root would skip it.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        rust: [stable, "1.98.0"]
    env:
      CIRROCAST_FORBID_NETWORK: "1"
      # Snapshot drift must fail the build, not hide in an untracked `.snap.new`: insta's `auto`
      # default writes nothing outside CI but still passes on a stale snapshot. Forcing `no` here
      # makes the committed snapshot the one that decides, as step 07's plan documents.
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  build-no-default-features:
    name: cargo build --no-default-features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The reduced build is a supported configuration (review §3.14 / nit 13), not a by-product:
      # without `offline-geo` there is no bundled city table, so `location update-data` and the
      # table-backed search paths must still compile and fail with their documented message instead
      # of a `#[cfg]`-driven compile error or a silent wrong answer.
      - run: cargo build --workspace --no-default-features --locked

  test-no-default-features:
    name: cargo test --no-default-features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    env:
      CIRROCAST_FORBID_NETWORK: "1"
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `tests/offline_geo.rs` and `tests/offline_lazy.rs` compile to nothing in this build (their
      # file-level `#![cfg(feature = "offline-geo")]`); everything else runs unchanged.
      - run: cargo test --workspace --no-default-features --locked

  package:
    name: cargo package (dry-run publish)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What `cargo package` would upload is the crate's public surface, so the file set is
      # reviewed on every pull request and the packaged crate is compiled from that file set.
      # Nothing is uploaded here: the real publish is the release workflow's `publish` job.
      - name: the packaged file set
        run: cargo package --list --locked
      - name: publish dry run
        run: cargo publish --dry-run --locked

  gates:
    name: repository gates
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The render layer must not reach into the transport, the cache or the provider registry:
      # the renderers shape their output from what the report carries (step 12's render-path audit).
      #
      # A line-based grep is defeatable by ordinary Rust: `use crate::{\n cache::Cache, …}` and
      # `crate :: cache::Cache` (spaces around the path separator) both pass one. This step is a
      # small token-aware scan instead. It first blanks comment and string-literal text (so a
      # rustdoc link such as `crate::provider::Capabilities`, or an error message that merely names
      # a module, is documentation rather than a dependency) while keeping every byte offset, then
      # looks for:
      #   * a `crate`/`super` path segment naming `http`, `provider` or `cache` — whatever the
      #     spacing around `::`, so `crate :: cache` is one path;
      #   * the names inside a grouped import, whose braces are matched by balance so a nested group
      #     (`crate::{model::{…}, cache}`) cannot hide one.
      # It needs nothing but the interpreter the runner already ships.
      - name: no render/model dependency on http, provider or cache
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          ROOTS = ("src/render", "src/model")


          def blanked(src):
              """Comment and string-literal text replaced by spaces, offsets and newlines kept."""
              out = list(src)
              n = len(src)

              def blank(a, b):
                  for k in range(a, b):
                      if out[k] != "\n":
                          out[k] = " "

              i = 0
              while i < n:
                  c = src[i]
                  if c == "/" and i + 1 < n and src[i + 1] == "/":
                      j = src.find("\n", i)
                      j = n if j == -1 else j
                      blank(i, j)
                      i = j
                  elif c == "/" and i + 1 < n and src[i + 1] == "*":
                      depth, j = 0, i
                      while j < n:
                          if src.startswith("/*", j):
                              depth += 1
                              j += 2
                          elif src.startswith("*/", j):
                              depth -= 1
                              j += 2
                              if depth == 0:
                                  break
                          else:
                              j += 1
                      blank(i, j)
                      i = j
                  elif c == '"':
                      j = i + 1
                      while j < n:
                          if src[j] == "\\":
                              j += 2
                              continue
                          if src[j] == '"':
                              j += 1
                              break
                          j += 1
                      blank(i, j)
                      i = j
                  else:
                      i += 1
              return "".join(out)


          PATH = re.compile(
              r"(?<![A-Za-z0-9_])(?:crate|super)\s*::\s*(http|provider|cache)(?![A-Za-z0-9_])"
          )
          GROUP = re.compile(r"(?<![A-Za-z0-9_])(?:crate|super)\s*::\s*\{")
          NAME = re.compile(r"(?<![A-Za-z0-9_])(http|provider|cache)(?![A-Za-z0-9_])")


          def offences(text):
              hits = []
              for match in PATH.finditer(text):
                  hits.append(match.start(1))
              for match in GROUP.finditer(text):
                  depth, j = 0, match.end() - 1
                  while j < len(text):
                      if text[j] == "{":
                          depth += 1
                      elif text[j] == "}":
                          depth -= 1
                          if depth == 0:
                              break
                      j += 1
                  for name in NAME.finditer(text, match.end(), j):
                      hits.append(name.start(1))
              return hits


          found = False
          for root in ROOTS:
              for source in sorted(pathlib.Path(root).rglob("*.rs")):
                  text = blanked(source.read_text())
                  for offset in sorted(offences(text)):
                      line = text.count("\n", 0, offset) + 1
                      print(f"{source}:{line}")
                      found = True
          if found:
              print("::error::src/render and src/model must not reference http, provider or cache")
              sys.exit(1)
          PY
      # LICENSES/GPL-3.0-or-later.txt is a real copy (a Windows checkout cannot rely on symlinks),
      # so it must not drift from the root LICENSE GitHub detects.
      - name: LICENSE copy matches LICENSES/GPL-3.0-or-later.txt
        run: cmp -s LICENSE LICENSES/GPL-3.0-or-later.txt

  reuse:
    name: reuse lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # `--locked` makes cargo-deny judge the committed graph. Without it cargo metadata is
          # free to update `Cargo.lock` when the manifest disagrees, so a dependency set the build
          # would refuse could still pass the licence and advisory gate. `--all-features` is the
          # action's own default, kept because setting `arguments` replaces the default.
          arguments: --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `cargo audit` beside `cargo deny`: mirrored advisory databases can lag behind the live
      # RUSTSEC data, so the two checks are independent signals.
      #
      # The pin is the `main` commit "Update to use Node 24 (#48)" (2026-03-20), not a release: the
      # action's newest release, v2.0.0, still declares `node20`, which GitHub now runs on Node 24
      # with a deprecation warning. The commit changes only `runs.using` (plus the changelog and
      # package metadata), so it is safe to pin; replace it with the next release's tag when one
      # exists.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, Node 24 fix (unreleased)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The performance budget (step 21, docs/performance.md). The harness measures the release binary
  # in a pinned sandbox with the network forbidden, the compare tool holds the fresh medians against
  # the committed baseline (a 20 % ratio gate) and the hard budgets, and the two weight tools are
  # the dependency audit's input. A normal run never writes a baseline: re-recording is the
  # `record_baseline` dispatch input and the job below, and the result is a reviewed commit.
  perf:
    name: performance budget
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_baseline) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # None of the three tools is on the runner image. Installing them from source keeps the
      # dependency policy (crates.io, versions visible in the log) and adds no third-party action.
      - name: install the measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hyperfine
          cargo install cargo-bloat cargo-llvm-lines --locked
      - name: measure the release binary
        run: scripts/bench/run.sh
      - name: compare against the committed baseline
        run: python3 scripts/bench/compare.py perf/baseline.json target/bench/raw.json
      # The audit's raw material, uploaded rather than gated: the numbers move with the toolchain
      # and the decisions they inform are reviewed in docs/performance.md, not enforced per run.
      - name: dependency weight
        run: |
          cargo bloat --profile release-audit --crates -n 20 | tee target/bench/bloat-crates.txt
          cargo llvm-lines --release --lib -p cirrocast | head -n 20 | tee target/bench/llvm-lines.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: perf-measurements
          path: |
            target/bench/raw.json
            target/bench/*.json
            target/bench/*.txt
          if-no-files-found: warn

  record-baseline:
    name: re-record the performance baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_baseline }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install the measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hyperfine
      - name: measure the release binary
        run: scripts/bench/run.sh
      # The cold figure is manual (scripts/bench/cold.sh) and carries over from the committed
      # baseline; everything else is this runner's measurement, machine spec included.
      - name: compose the new baseline
        run: python3 scripts/bench/record.py --raw target/bench/raw.json --out perf/baseline.json
      - name: what changed
        run: |
          git --no-pager diff --stat perf/baseline.json
          git --no-pager diff perf/baseline.json | head -n 60
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: perf-baseline
          path: perf/baseline.json
